<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Garkha Express</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
  <div class="logo">🛒 Garkha Express</div>

  <button class="cartBtn" onclick="toggleCart()">
    🛒 Cart (<span id="cartCount">0</span>)
  </button>
</header>

<div class="search">
  <input
    type="text"
    id="searchInput"
    placeholder="Search Grocery..."
    oninput="searchProducts()"
  >
</div>

<div class="products">

  <div class="card">
    <h3>🥔 Potato</h3>
    <div class="price">₹30/kg</div>

    <button onclick="addToCart('Potato',30)">
      Add to Cart
    </button>
  </div>

  <div class="card">
    <h3>🧅 Onion</h3>
    <div class="price">₹40/kg</div>

    <button onclick="addToCart('Onion',40)">
      Add to Cart
    </button>
  </div>

  <div class="card">
    <h3>🥛 Milk</h3>
    <div class="price">₹55</div>

    <button onclick="addToCart('Milk',55)">
      Add to Cart
    </button>
  </div>

  <div class="card">
    <h3>🍚 Rice</h3>
    <div class="price">₹60/kg</div>

    <button onclick="addToCart('Rice',60)">
      Add to Cart
    </button>
  </div>

</div>


<!-- CART -->

<div id="cartBox" class="cartBox">

  <button class="closeBtn" onclick="toggleCart()">✕</button>

  <h2>🛒 My Cart</h2>

  <div id="cartItems">
    No items added
  </div>

  <hr>

  <h3>
    Total: ₹<span id="total">0</span>
  </h3>

  <button class="checkoutBtn" onclick="openCheckout()">
    Proceed to Checkout
  </button>

</div>


<!-- CHECKOUT -->

<div id="checkoutBox" class="checkoutBox">

  <h2>📦 Delivery Details</h2>

  <input
    type="text"
    id="customerName"
    placeholder="Your Name"
  >

  <input
    type="tel"
    id="phone"
    placeholder="Mobile Number"
  >

  <input
    type="text"
    id="district"
    placeholder="District"
  >

  <textarea
    id="address"
    placeholder="Full Delivery Address"
  ></textarea>

  <button onclick="getLocation()">
    📍 Use My Current Location
  </button>

  <p id="locationStatus">
    Location not selected
  </p>

  <button class="placeOrder" onclick="placeOrder()">
    🛍️ Place Order
  </button>

  <button class="cancelBtn" onclick="closeCheckout()">
    Cancel
  </button>

</div>


<footer>
  📞 Garkha Express Grocery Delivery
</footer>


<script src="script.js"></script>

</body>
</html>
