<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garkha Express</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
🛒 Garkha Express
</header>

<div class="search">
<input type="text" placeholder="Search Grocery...">
</div>

<div class="products">

<div class="card">
<h3>🥔 Potato</h3>
<div class="price">₹30/kg</div>
<button>Add to Cart</button>
</div>

<div class="card">
<h3>🧅 Onion</h3>
<div class="price">₹40/kg</div>
<button>Add to Cart</button>
</div>

<div class="card">
<h3>🥛 Milk</h3>
<div class="price">₹55</div>
<button>Add to Cart</button>
</div>

<div class="card">
<h3>🍚 Rice</h3>
<div class="price">₹60/kg</div>
<button>Add to Cart</button>
</div>

</div>

<footer>
📞 Order on WhatsApp: +91 XXXXXXXXXX
</footer>
<div id="cartBox" style="display:none; position:fixed; top:70px; right:10px; width:280px; background:white; border:1px solid #ccc; border-radius:10px; padding:15px; box-shadow:0 2px 10px rgba(0,0,0,.2); z-index:1000;">
  <h3>🛒 My Cart</h3>
  <div id="cartItems">No items added</div>
  <hr>
  <b>Total: ₹<span id="total">0</span></b>
  <br><br>
  <button onclick="sendWhatsApp()">Order on WhatsApp</button>
</div>
<script src="script.js"></script>

</body>
</html>
